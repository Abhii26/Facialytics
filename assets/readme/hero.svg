    <text x="54" y="166" font-size="86" font-weight="650" letter-spacing="-5" fill="#f3f4ee">facialytics<tspan fill="#d8f99c">.</tspan></text>
    <text x="59" y="223" font-family="Georgia,serif" font-size="37" font-style="italic" fill="#d8f99c">A new perspective on every face.</text>
    <text x="60" y="268" font-size="17" fill="#a0a8ac">Live landmarks. Deliberate matching. In your browser.</text>
