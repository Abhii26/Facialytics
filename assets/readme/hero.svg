<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title description">
  <title id="title">Facialytics Studio — Every face. A new perspective.</title>
  <desc id="description">A dark editorial banner with lime facial contours, the Facialytics wordmark, and a browser computer vision tagline.</desc>
